aid: allcare
name: AllCare
description: >-
  AllCare is a Philippines-based digital employee-benefits and healthcare membership
  platform for freelancers and small-to-medium enterprises. It aggregates worker
  benefits that individuals and small teams would otherwise struggle to access,
  bundling HMO coverage, group life insurance, 24/7 teleconsultation, dental and
  optical care, mental-health counseling, annual physical exams, and productivity
  perks into flat-rate membership packages. Its SME Benefits Package is sold on an
  annual per-employee basis (minimum five employees) and is managed through a web
  dashboard for enrollment, member management, and benefit utilization. AllCare is
  a portfolio company of 500 Global and is tracked in the API Evangelist network as
  a healthcare/insurtech company profile.
